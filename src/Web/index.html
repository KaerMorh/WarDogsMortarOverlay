<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141923;color:#e8f0ec;font:12px 'Segoe UI','Microsoft YaHei UI',sans-serif}canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}.chip{position:absolute;pointer-events:none;background:#141923e8;border:1px solid #40504b;border-radius:6px;padding:9px 12px;backdrop-filter:blur(8px)}#coord{bottom:14px;left:14px;font-variant-numeric:tabular-nums}#legend{top:14px;left:14px;line-height:23px}.o{color:#91bffd}.t{color:#f6b284}#zoom{bottom:14px;right:14px}#loading{top:14px;right:14px;color:#94a5a5}
</style></head><body><canvas id="map" aria-label="交互地图"></canvas><div id="legend" class="chip"><span class="o">● 炮位</span>　<span class="t">◆ 目标</span><br><span id="mode">点击设置目标</span></div><div id="coord" class="chip">滚轮缩放 · 拖动平移</div><div id="zoom" class="chip">1×</div><div id="loading" class="chip">离线地图</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let W=800,H=600,dpr=1,scale=1,cx=81.89,cy=81.91,state={map:'bakurani',mode:'target',maxRange:6.84},cache=new Map(),down=null,dragging=false,first=true,raf=0,errorSent=false;
const xmin=-.03,ymax=163.83,span=163.84;
const send=m=>window.chrome?.webview?.postMessage(m);
function screen(p){return{x:W/2+(p.x-cx)*scale,y:H/2-(p.y-cy)*scale}}
function world(x,y){return{x:cx+(x-W/2)/scale,y:cy-(y-H/2)/scale}}
function fit(){let a=state.origin,b=state.target;if(a&&b){cx=(a.x+b.x)/2;cy=(a.y+b.y)/2;scale=Math.min(W/Math.max(Math.abs(a.x-b.x)*2.8,12),H/Math.max(Math.abs(a.y-b.y)*2.8,12))}else if(a){cx=a.x;cy=a.y;scale=Math.min(W,H)/25}else{cx=81.89;cy=81.91;scale=Math.min(W,H)/span}draw()}
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;if(first){fit();first=false}draw()}
function image(z,x,y){let k=`${state.map}/${z}/${x}/${y}`;if(cache.has(k))return cache.get(k);let i=new Image();cache.set(k,i);i.onload=draw;i.onerror=()=>{if(!errorSent){send({type:'error'});errorSent=true}};i.src=`maps/tiles/${state.map}/zoom_${z}/${x}_${y}.webp`;return i}
function draw(){if(raf)return;raf=requestAnimationFrame(paint)}
function paint(){raf=0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#111a1d';ctx.fillRect(0,0,W,H);
 let z=Math.max(0,Math.min(4,Math.ceil(Math.log2(scale*span/256)))),n=2**z,unit=span/n;
 let tl=world(0,0),br=world(W,H);let left=Math.max(0,Math.floor((tl.x-xmin)/unit)),right=Math.min(n-1,Math.floor((br.x-xmin)/unit)),top=Math.max(0,Math.floor((ymax-tl.y)/unit)),bottom=Math.min(n-1,Math.floor((ymax-br.y)/unit));
 for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){let i=image(z,x,y),p=screen({x:xmin+x*unit,y:ymax-y*unit});if(i.complete&&i.naturalWidth)ctx.drawImage(i,p.x,p.y,unit*scale+.7,unit*scale+.7)}
 ctx.fillStyle='#09121122';ctx.fillRect(0,0,W,H);
 let step=scale>35?1:scale>8?5:20;ctx.strokeStyle='#e4eee212';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(tl.x/step)*step;x<br.x;x+=step){let p=screen({x,y:0});ctx.moveTo(p.x,0);ctx.lineTo(p.x,H)}for(let y=Math.floor(br.y/step)*step;y<tl.y;y+=step){let p=screen({x:0,y});ctx.moveTo(0,p.y);ctx.lineTo(W,p.y)}ctx.stroke();
 if(state.origin){let p=screen(state.origin);ctx.strokeStyle='#91bffd50';ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(p.x,p.y,state.maxRange*scale,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
 if(state.origin&&state.target){let a=screen(state.origin),b=screen(state.target);ctx.strokeStyle='#91bffd';ctx.lineWidth=1.7;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);let distance=Math.hypot(state.target.x-state.origin.x,state.target.y-state.origin.y)*100;label((a.x+b.x)/2,(a.y+b.y)/2,`${Math.round(distance)} m`, '#91bffd')}
 towers();marker(state.origin,'origin');marker(state.target,'target');
 let meters=scale>15?100:scale>3?500:2000,pixels=meters/100*scale;ctx.strokeStyle='#e7efe9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,H-65);ctx.lineTo(20+pixels,H-65);ctx.stroke();ctx.fillStyle='#e7efe9';ctx.font='11px Segoe UI';ctx.fillText(`${meters} m`,20,H-72);
 document.querySelector('#zoom').textContent=`${(scale/(Math.min(W,H)/span)).toFixed(1)}×`;
}
function label(x,y,text,color){ctx.font='12px Segoe UI';let w=ctx.measureText(text).width;ctx.fillStyle='#0c1418ee';ctx.fillRect(x-w/2-8,y-12,w+16,24);ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(text,x,y+4);ctx.textAlign='left'}
function towers(){for(const t of state.towers||[]){const p=screen(t);if(p.x<0||p.y<0||p.x>W||p.y>H)continue;ctx.strokeStyle='#c4d3e4';ctx.fillStyle='#172130dd';ctx.lineWidth=1.5;ctx.beginPath();ctx.rect(p.x-5,p.y-6,10,12);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(p.x-8,p.y+7);ctx.lineTo(p.x+8,p.y+7);ctx.stroke();if(scale>6)label(p.x,p.y+24,t.label,'#c4d3e4')}}
function nearestTower(x,y){for(const t of state.towers||[]){const p=screen(t);if(Math.hypot(p.x-x,p.y-y)<14||(scale>6&&Math.abs(p.x-x)<30&&Math.abs(p.y+24-y)<12))return t}return null}
function marker(p,role){if(!p)return;let s=screen(p),o=role==='origin',color=o?'#91bffd':'#f6b284';ctx.globalAlpha=1;ctx.fillStyle='#141923';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();if(o)ctx.arc(s.x,s.y,9,0,Math.PI*2);else{ctx.moveTo(s.x,s.y-11);ctx.lineTo(s.x+11,s.y);ctx.lineTo(s.x,s.y+11);ctx.lineTo(s.x-11,s.y);ctx.closePath()}ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();label(s.x,s.y-29,(o?'炮位 ':'目标 ')+`X${p.x.toFixed(2)} Y${p.y.toFixed(2)}`,color);ctx.globalAlpha=1}
function nearest(x,y){for(let role of ['target','origin'])if(state[role]){let p=screen(state[role]);if(Math.hypot(x-p.x,y-p.y)<18)return role}return null}
function setPoint(role,x,y){let p=world(x,y);p.x=Math.max(xmin,Math.min(xmin+span,p.x));p.y=Math.max(ymax-span,Math.min(ymax,p.y));p.x=Math.round(p.x*100)/100;p.y=Math.round(p.y*100)/100;state[role]=p;send({type:'point',role,...p});draw()}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);down={x:e.offsetX,y:e.offsetY,cx,cy,role:nearest(e.offsetX,e.offsetY),tower:nearestTower(e.offsetX,e.offsetY),moved:false};dragging=true;send({type:'drag',active:true})});
canvas.addEventListener('pointermove',e=>{let p=world(e.offsetX,e.offsetY);document.querySelector('#coord').textContent=`X ${p.x.toFixed(2)}　Y ${p.y.toFixed(2)}`;if(!down)return;let dx=e.offsetX-down.x,dy=e.offsetY-down.y;if(Math.hypot(dx,dy)>3)down.moved=true;if(down.role)setPoint(down.role,e.offsetX,e.offsetY);else if(down.moved){cx=down.cx-dx/scale;cy=down.cy+dy/scale;draw()}});
function finish(e){if(!down)return;if(e.type==='pointerup'&&!down.moved&&!down.role){if(down.tower){let p=screen(down.tower);setPoint('target',p.x,p.y)}else setPoint(state.mode,e.offsetX,e.offsetY);}down=null;dragging=false;send({type:'drag',active:false});draw()}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
canvas.addEventListener('wheel',e=>{e.preventDefault();let before=world(e.offsetX,e.offsetY);scale=Math.max(Math.min(W,H)/span*.7,Math.min(400,scale*Math.exp(-e.deltaY*.0015)));cx=before.x-(e.offsetX-W/2)/scale;cy=before.y+(e.offsetY-H/2)/scale;draw()},{passive:false});
window.chrome?.webview?.addEventListener('message',e=>{let m=e.data;if(m.type==='fit'){fit();return}if(m.type!=='state')return;let changed=m.map!==state.map,initial=!state.origin&&!!m.origin;state=m;document.querySelector('#mode').textContent=`点击设置${m.mode==='origin'?'炮位':'目标'}`;if(changed){cache.clear();errorSent=false;fit()}else if(initial&&!dragging)fit();draw()});
new ResizeObserver(resize).observe(canvas);send({type:'ready'});
</script></body></html>
