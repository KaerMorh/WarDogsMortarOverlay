# Optional HTTPS ingress. Set WARDOGS_DOMAIN to a domain pointing at this host.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      WARDOGS_DOMAIN: ${WARDOGS_DOMAIN:?Set WARDOGS_DOMAIN to your server domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
